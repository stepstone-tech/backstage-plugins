# Sample organization for the development backend.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: team-example
  title: Example Team
spec:
  type: team
  children: []
  members:
    - guest
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  profile:
    displayName: Guest User
    email: guest@example.com
  memberOf:
    - team-example
